<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f1">
  <title>微光</title>
  <link rel="manifest" href="./manifest-v10.webmanifest">
  <link rel="icon" href="./weiguang-gemini-v10-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./weiguang-gemini-v10-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <div class="brand-line">微光成长社</div>
        <div class="date-line" id="todayLabel"></div>
        <h1 id="pageTitle">记录此刻</h1>
      </div>
      <button id="installBtn" class="icon-button hidden" type="button" aria-label="安装到手机">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
      </button>
    </header>

    <main>
      <section id="view-record" class="view active">
        <div class="quote-card">
          <span>今日鼓励</span>
          <p id="encouragementText"></p>
        </div>

        <div class="wizard-card">
          <div class="progress">
            <span id="stepText">1 / 5</span>
            <div class="progress-track"><div id="progressBar"></div></div>
          </div>

          <div id="stepMood" class="step active">
            <h2>现在的你，最接近哪种状态？</h2>
            <p>不需要非常准确，选最接近的就好。</p>
            <button id="openMoodPicker" class="select-button" type="button">
              <span id="selectedMoodText">选择状态</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="unclearPanel" class="chip-panel hidden">
              <div class="small-title">如果说不清，它更像哪一种？</div>
              <div id="unclearOptions" class="chip-grid"></div>
            </div>
          </div>

          <div id="stepIntensity" class="step">
            <h2>这个感觉现在有多强？</h2>
            <p>0 是几乎没有，10 是快承受不住。</p>
            <div class="range-card">
              <div class="range-value"><span id="intensityValue">5</span><small>/10</small></div>
              <input id="intensityInput" type="range" min="0" max="10" value="5">
            </div>
          </div>

          <div id="stepEvent" class="step">
            <h2>在它出现前，发生了什么？</h2>
            <p>先选一个线索，再用一句话补充。</p>
            <div id="triggerOptions" class="chip-grid"></div>
            <textarea id="eventText" rows="4" placeholder="刚才发生了..."></textarea>
          </div>

          <div id="stepCoping" class="step">
            <h2>你刚才是怎么应对的？</h2>
            <p>真实记录就好，这里没有对错。</p>
            <div id="copingOptions" class="chip-grid"></div>
            <textarea id="copingText" rows="3" placeholder="我具体做了..."></textarea>
          </div>

          <div id="stepChange" class="step">
            <h2>现在有什么变化？</h2>
            <p>记录变化，是为了看见什么真的帮到了你。</p>
            <div id="changeOptions" class="chip-grid"></div>
            <div class="range-card compact">
              <div class="range-value"><span id="afterValue">4</span><small>/10</small></div>
              <input id="afterInput" type="range" min="0" max="10" value="4">
            </div>
            <textarea id="noteText" rows="3" placeholder="还想补充的话，可以写在这里"></textarea>
          </div>

          <div id="editingNotice" class="editing-notice hidden">
            <span>正在修改一条记录</span>
            <button id="cancelEdit" type="button">取消修改</button>
          </div>

          <div class="wizard-actions">
            <button id="backStep" class="secondary-button" type="button">上一步</button>
            <button id="nextStep" class="primary-button" type="button">下一步</button>
          </div>
        </div>
      </section>

      <section id="view-today" class="view">
        <div class="summary-card">
          <div class="section-head">
            <h2>今天</h2>
            <span id="todayCount">0 次记录</span>
          </div>
          <div id="todayStats" class="stat-grid"></div>
          <div id="todayCurve" class="curve-box"></div>
        </div>

        <div class="summary-card">
          <div class="section-head">
            <h2>每日总结</h2>
            <span>自动整理</span>
          </div>
          <p id="autoDailySummary" class="soft-text"></p>
          <textarea id="dailySummaryText" rows="4" placeholder="今天我想对自己说..."></textarea>
        </div>

        <div id="todayList" class="record-list"></div>
      </section>

      <section id="view-trends" class="view">
        <div class="segmented" role="tablist">
          <button class="active" data-period="day" type="button">日</button>
          <button data-period="week" type="button">周</button>
          <button data-period="month" type="button">月</button>
        </div>

        <div class="summary-card">
          <div class="section-head">
            <h2 id="trendTitle">今日趋势</h2>
            <span id="trendRange"></span>
          </div>
          <div id="trendStats" class="stat-grid"></div>
          <div id="trendChart" class="bar-chart"></div>
        </div>

        <div class="summary-card">
          <h2 id="periodSummaryTitle">总结提示</h2>
          <p id="periodAutoSummary" class="soft-text"></p>
          <textarea id="periodSummaryText" rows="5" placeholder="这一段时间，我观察到..."></textarea>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="history-tools">
          <button id="prevDay" class="icon-button" type="button" aria-label="前一天">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <input id="historyDate" type="date">
          <button id="nextDay" class="icon-button" type="button" aria-label="后一天">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <div class="summary-card">
          <div class="section-head">
            <h2 id="historyTitle">某一天</h2>
            <span id="historyCount">0 次记录</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <div id="historyList" class="record-list"></div>
        <div class="summary-card">
          <h2>时间轴</h2>
          <div id="allTimeline" class="timeline"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="active" data-view="record" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>记录</span>
      </button>
      <button data-view="today" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        <span>今天</span>
      </button>
      <button data-view="trends" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c4-8 7 0 10-6s4-3 6-7"/></svg>
        <span>趋势</span>
      </button>
      <button data-view="history" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16M4 8h16M4 16h16"/></svg>
        <span>回看</span>
      </button>
    </nav>
  </div>

  <div id="moodSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="选择情绪状态">
      <div class="sheet-grip"></div>
      <div class="section-head">
        <h2>选择最接近的状态</h2>
        <button id="closeMoodPicker" class="text-button" type="button">完成</button>
      </div>
      <div id="moodGroups" class="mood-groups"></div>
    </div>
  </div>

  <div id="detailSheet" class="sheet hidden" aria-hidden="true">
    <div class="detail-backdrop sheet-backdrop"></div>
    <div class="sheet-panel detail-panel" role="dialog" aria-modal="true" aria-label="记录详情">
      <div class="sheet-grip"></div>
      <div class="section-head">
        <h2>记录详情</h2>
        <button id="closeDetail" class="text-button" type="button">关闭</button>
      </div>
      <div id="detailContent" class="detail-content"></div>
      <div class="detail-actions">
        <button id="detailEdit" class="secondary-button" type="button">修改</button>
        <button id="detailDelete" class="danger-button" type="button">删除</button>
      </div>
    </div>
  </div>

  <template id="recordTemplate">
    <article class="record-card">
      <div class="record-time"></div>
      <div class="record-body">
        <strong></strong>
        <p></p>
        <small></small>
      </div>
      <div class="record-actions">
        <div class="record-score"></div>
        <button class="mini-action edit-record" type="button" aria-label="修改记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="mini-action delete-record" type="button" aria-label="删除记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
